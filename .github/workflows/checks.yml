# Runs on every pull request and every push to main (v3.43.0).
#   tests — the Node test suite (npm test), no dependencies.
#   journeys — scripts/journeys.mjs (v3.204.0): bills, a transfer, an automatic payment, a scenario, a CSV
#          and a PDF import, end to end on invented data; then the speed budget on a large invented
#          household at 4x CPU slowdown. Fails on a broken journey or a step over budget.
#   lint — npm run check (v3.201.0): ESLint, TypeScript's checker over src/calc, stylelint. Dev-only tools
#          from package.json's devDependencies, installed here from the lockfile.
#   pages — scripts/smoke.mjs: every page and subtab in headless Chromium at 320px, 390px and 1280px,
#           light and dark, failing on page errors, empty pages, sideways scroll, NaN/undefined
#           text and bars that don't draw. Playwright is installed here only, never added to
#           package.json — the app and its test suite stay dependency-free.
#   screens — pull requests only: the base branch and the PR photographed and compared (below).
# November 2026, faster checks: every browser job runs in Playwright's own image, which has Chromium and its system
# libraries already (installing them took five minutes a job); the journeys run as five parallel shards (one run was
# 15 minutes), the accessibility scan as four (a width and a colour scheme each), and the accessibility journeys in one
# run of their own beside them.
name: Checks
on:
  pull_request:
  push:
    branches: [main]
    # The daily price commit (prices.yml) and the cash rate commit (cashrate.yml) change data, not code.
    paths-ignore: ["prices/**", "rates/**"]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # v3.204.0: the suite with coverage — the totals go in the job summary.
      - run: npm run coverage | tee coverage.txt
        # Explicit bash enables pipefail, so tee cannot hide failing tests.
        shell: bash
      - run: |
          { echo "### Test coverage"; echo '```'; grep -E "^# (file|all files| *[a-z]+/ *\|)" coverage.txt | sed 's/^# //' | grep -E "^(file|all files)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
  journeys:
    runs-on: ubuntu-24.04
    # Playwright's image: Chromium and its system libraries are in it, so nothing installs (it took five minutes a job).
    # Move the tag with the npm install below when upgrading; user 1001 is the image's own, so Chromium keeps its sandbox.
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    name: journeys (${{ matrix.shard }}/5)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.0
      # Every fifth journey, from this shard's; the speed budget once, in the last shard.
      - run: node scripts/journeys.mjs
        env:
          SHARD: ${{ matrix.shard }}/5
          SPEED: ${{ matrix.shard == 5 && '1' || '0' }}
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
  pages:
    runs-on: ubuntu-24.04
    # Playwright's image: Chromium and its system libraries are in it, so nothing installs (it took five minutes a job).
    # Move the tag with the npm install below when upgrading; user 1001 is the image's own, so Chromium keeps its sandbox.
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
      options: --user 1001
    # Two halves (scripts/smoke.mjs SMOKE_PASSES): the phone-to-tablet widths with the empty household, the scenario page
    # and Simple mode; the desktop width and dark mode.
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: 1
            passes: light-320,light-390,light-768
            extras: "1"
          - part: 2
            passes: light-1280,dark-390,dark-1280
            extras: "0"
    name: pages (${{ matrix.part }}/2)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.0
      - run: node scripts/smoke.mjs
        env:
          SMOKE_PASSES: ${{ matrix.passes }}
          SMOKE_EXTRAS: ${{ matrix.extras }}
  accessibility:
    runs-on: ubuntu-24.04
    # Playwright's image: Chromium and its system libraries are in it, so nothing installs (it took five minutes a job).
    # Move the tag with the npm install below when upgrading; user 1001 is the image's own, so Chromium keeps its sandbox.
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        width: [390, 1280]
        scheme: [light, dark]
    name: accessibility (${{ matrix.width }}px, ${{ matrix.scheme }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.0 axe-core@4.14.0
      # One width and one colour scheme a job (the script's own A11Y_WIDTHS and A11Y_SCHEMES).
      - run: node scripts/accessibility.mjs
        env:
          A11Y_DIR: accessibility-report
          A11Y_WIDTHS: ${{ matrix.width }}
          A11Y_SCHEMES: ${{ matrix.scheme }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-report-${{ matrix.width }}-${{ matrix.scheme }}
          path: accessibility-report
          retention-days: 14
  # The journeys that check their own flow's accessibility (each its *_A11Y flag), in one run: they were fifteen steps,
  # each starting Chromium again.
  accessibility-flows:
    runs-on: ubuntu-24.04
    # Playwright's image: Chromium and its system libraries are in it, so nothing installs (it took five minutes a job).
    # Move the tag with the npm install below when upgrading; user 1001 is the image's own, so Chromium keeps its sandbox.
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: 1
            journeys: errorsummaries,bankconfirmfailure,signedamounts,importchooser,billconfirmation,usermenubounds,payslipreview,importrestorefocus
          - part: 2
            journeys: displaydates,propertystatementreview,bankreadrecovery,exactsearch,propertypicker,brokerreview,errorsummarybounds,rowlabelfocus
    name: accessibility-flows (${{ matrix.part }}/2)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.0 axe-core@4.14.0
      - run: node scripts/journeys.mjs
        env:
          JOURNEYS: ${{ matrix.journeys }}
          SPEED: 0
          BILLS_A11Y: 1
          BILLS_SHOTS: accessibility-report/bill-confirmation
          SEARCH_A11Y: 1
          MENU_A11Y: 1
          MENU_SHOTS: accessibility-report/user-menu
          BANK_SAVE_A11Y: 1
          BANK_SAVE_SHOTS: accessibility-report/bank-save
          BANK_READ_A11Y: 1
          BANK_READ_SHOTS: accessibility-report/bank-read
          PROPERTY_PICKER_A11Y: 1
          PROPERTY_PICKER_SHOTS: accessibility-report/property-picker
          PROPERTY_READ_A11Y: 1
          PROPERTY_READ_SHOTS: accessibility-report/property-statement
          BROKER_A11Y: 1
          BROKER_SHOTS: accessibility-report/broker-review
          PAYSLIP_A11Y: 1
          PAYSLIP_SHOTS: accessibility-report/payslip-review
          IMPORT_A11Y: 1
          IMPORT_SHOTS: accessibility-report/import-chooser
          ERROR_BOUNDS_SHOTS: accessibility-report/error-bounds
          DISPLAY_DATE_A11Y: 1
          DISPLAY_DATE_SHOTS: accessibility-report/display-dates
          SIGNED_A11Y: 1
          ERROR_A11Y: 1
          ERROR_A11Y_DIR: accessibility-report/error-summaries
          ERROR_TRACE_DIR: accessibility-report/error-summary-trace
          ERROR_SHOTS: accessibility-report/error-summaries
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-flows-${{ matrix.part }}
          path: accessibility-report
          retention-days: 14
  # v3.130.0: what a pull request changes on screen. The same smoke script photographs every view of
  # the base branch and of the PR (light, 390px and 1280px, at a fixed date and time so identical code
  # gives identical pictures), scripts/shotdiff.mjs compares them pixel by pixel, and the changed views
  # go in the job summary and, side by side with the difference marked, in the "screens" artifact.
  # Informational: a visual change never fails the check.
  screens:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    # Playwright's image: Chromium and its system libraries are in it, so nothing installs (it took five minutes a job).
    # Move the tag with the npm install below when upgrading; user 1001 is the image's own, so Chromium keeps its sandbox.
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
        with:
          path: head
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.0
        working-directory: head
      - name: Photograph the base branch
        run: SMOKE_ROOT=../base SHOTS_DIR=../shots/base node scripts/smoke.mjs
        working-directory: head
      - name: Photograph this pull request
        run: SHOTS_DIR=../shots/head node scripts/smoke.mjs
        working-directory: head
      - name: Check whether the polish audit changed
        run: |
          if [ -f head/docs/audits/visual-polish-308.md ] && ! cmp -s head/docs/audits/visual-polish-308.md base/docs/audits/visual-polish-308.md; then
            echo "RUN_POLISH_AUDIT=true" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
        if: env.RUN_POLISH_AUDIT == 'true'
        with:
          ref: 770b8a5a6389ad6d79b16dc91c8f91d0d6f1e3fe
          path: polish-original
      - name: Photograph the original polish findings
        if: env.RUN_POLISH_AUDIT == 'true'
        run: POLISH_ROOT=../polish-original POLISH_SHOTS=../polish-308/before node scripts/polish308-shots.mjs
        working-directory: head
      - name: Photograph the resolved polish findings
        if: env.RUN_POLISH_AUDIT == 'true'
        run: POLISH_SHOTS=../polish-308/after node scripts/polish308-shots.mjs
        working-directory: head
      - uses: actions/upload-artifact@v4
        if: always() && env.RUN_POLISH_AUDIT == 'true'
        with:
          name: polish-308
          path: polish-308
          retention-days: 14
      - name: Compare
        run: node scripts/shotdiff.mjs ../shots/base ../shots/head ../shots/diff && cat ../shots/diff/summary.md >> "$GITHUB_STEP_SUMMARY"
        working-directory: head
      - uses: actions/upload-artifact@v4
        with:
          name: screens
          path: shots/diff
          retention-days: 14
