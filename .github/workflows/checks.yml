# Runs on every pull request and every push to main (v3.43.0).
#   tests — the Node test suite (npm test), no dependencies.
#   journeys — scripts/journeys.mjs (v3.204.0): bills, a transfer, an automatic payment, a scenario, a CSV
#          and a PDF import, end to end on invented data; then the speed budget on a large invented
#          household at 4x CPU slowdown. Fails on a broken journey or a step over budget.
#   lint — npm run check (v3.201.0): ESLint, TypeScript's checker over src/calc, stylelint. Dev-only tools
#          from package.json's devDependencies, installed here from the lockfile.
#   pages — scripts/smoke.mjs: every page and subtab in headless Chromium at 320px, 390px and 1280px,
#           light and dark, failing on page errors, empty pages, sideways scroll, NaN/undefined
#           text and bars that don't draw. Playwright is installed here only, never added to
#           package.json — the app and its test suite stay dependency-free.
#   screens — pull requests only: the base branch and the PR photographed and compared (below).
name: Checks
on:
  pull_request:
  push:
    branches: [main]
    # The daily price commit (prices.yml) and the cash rate commit (cashrate.yml) change data, not code.
    paths-ignore: ["prices/**", "rates/**"]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # v3.204.0: the suite with coverage — the totals go in the job summary.
      - run: npm run coverage | tee coverage.txt
        # Explicit bash enables pipefail, so tee cannot hide failing tests.
        shell: bash
      - run: |
          { echo "### Test coverage"; echo '```'; grep -E "^# (file|all files| *[a-z]+/ *\|)" coverage.txt | sed 's/^# //' | grep -E "^(file|all files)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
  journeys:
    # Pinned with the pages job: Playwright 1.56 and ubuntu-24.04 move together.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/journeys.mjs
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
  pages:
    # Pinned: ubuntu-latest moved to 26.04, where Playwright 1.56 can't install Chromium. Move both
    # together (the runner and the Playwright version) when upgrading.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/smoke.mjs
  accessibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.0 axe-core@4.14.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/accessibility.mjs
        env:
          A11Y_DIR: accessibility-report
      - name: Bill confirmation
        run: node scripts/journeys.mjs
        env:
          JOURNEYS: billconfirmation
          SPEED: 0
          BILLS_A11Y: 1
          BILLS_SHOTS: accessibility-report/bill-confirmation
      - name: Exact-record search
        run: node scripts/journeys.mjs
        env:
          JOURNEYS: exactsearch
          SPEED: 0
          SEARCH_A11Y: 1
      - name: User menu viewport bounds
        run: node scripts/journeys.mjs
        env:
          JOURNEYS: usermenubounds
          SPEED: 0
          MENU_A11Y: 1
          MENU_SHOTS: accessibility-report/user-menu
      - name: Bank statement read recovery
        run: node scripts/journeys.mjs
        env:
          JOURNEYS: bankreadrecovery
          SPEED: 0
          BANK_READ_A11Y: 1
          BANK_READ_SHOTS: accessibility-report/bank-read
      - name: Property statement review and completion
        run: node scripts/journeys.mjs
        env:
          JOURNEYS: propertystatementreview
          SPEED: 0
          PROPERTY_READ_A11Y: 1
          PROPERTY_READ_SHOTS: accessibility-report/property-statement
      - name: Broker trade review
        run: node scripts/journeys.mjs
        env:
          JOURNEYS: brokerreview
          SPEED: 0
          BROKER_A11Y: 1
          BROKER_SHOTS: accessibility-report/broker-review
      - name: Payslip review before saving
        run: node scripts/journeys.mjs
        env:
          JOURNEYS: payslipreview
          SPEED: 0
          PAYSLIP_A11Y: 1
          PAYSLIP_SHOTS: accessibility-report/payslip-review
      - name: Shared import chooser
        run: node scripts/journeys.mjs
        env:
          JOURNEYS: importchooser
          SPEED: 0
          IMPORT_A11Y: 1
          IMPORT_SHOTS: accessibility-report/import-chooser
      - name: Long-form error summaries
        run: node scripts/journeys.mjs
        env:
          JOURNEYS: errorsummaries
          SPEED: 0
          ERROR_A11Y: 1
          ERROR_A11Y_DIR: accessibility-report/error-summaries
          ERROR_SHOTS: accessibility-report/error-summaries
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-report
          path: accessibility-report
          retention-days: 14
  # v3.130.0: what a pull request changes on screen. The same smoke script photographs every view of
  # the base branch and of the PR (light, 390px and 1280px, at a fixed date and time so identical code
  # gives identical pictures), scripts/shotdiff.mjs compares them pixel by pixel, and the changed views
  # go in the job summary and, side by side with the difference marked, in the "screens" artifact.
  # Informational: a visual change never fails the check.
  screens:
    if: github.event_name == 'pull_request'
    # Pinned: ubuntu-latest moved to 26.04, where Playwright 1.56 can't install Chromium. Move both
    # together (the runner and the Playwright version) when upgrading.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: head
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.0
        working-directory: head
      - run: npx playwright install --with-deps chromium
        working-directory: head
      - name: Photograph the base branch
        run: SMOKE_ROOT=../base SHOTS_DIR=../shots/base node scripts/smoke.mjs
        working-directory: head
      - name: Photograph this pull request
        run: SHOTS_DIR=../shots/head node scripts/smoke.mjs
        working-directory: head
      - name: Compare
        run: node scripts/shotdiff.mjs ../shots/base ../shots/head ../shots/diff && cat ../shots/diff/summary.md >> "$GITHUB_STEP_SUMMARY"
        working-directory: head
      - uses: actions/upload-artifact@v4
        with:
          name: screens
          path: shots/diff
          retention-days: 14
