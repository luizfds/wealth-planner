# The daily price file (v3.133.0, roadmap item 145). Each weekday after the US close (and so after the
# previous ASX close) this fetches end-of-day prices for the fixed public list in prices/universe.json
# and commits prices/latest.json and prices/weekly.json, which the app reads from its own site.
# Prices come from Twelve Data, which needs a free key in the repository secret TWELVE_DATA_KEY
# (Settings → Secrets and variables → Actions); about 50 minutes at the free plan's 8 a minute.
# Run it by hand from the Actions tab.
name: Prices
on:
  schedule:
    - cron: "31 22 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prices
  cancel-in-progress: false
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/prices/fetch.mjs
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          STOOQ_APIKEY: ${{ secrets.STOOQ_APIKEY }}
      - name: Commit the price file
        run: |
          git config user.name "wealth-planner prices"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices/latest.json prices/weekly.json
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git commit -m "Prices for $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
